name: Runtime Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/runtime-image.yml"
      - ".dockerignore"
      - "deploy/runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "agents/**"
      - "bins/**"
      - "crates/**"
      - "memory/**"
      - "skills/stock_research/**"
      - "soul.md"
      - "scripts/package_runtime_bundle.sh"
      - "scripts/verify_runtime_bundle.sh"
      - "scripts/stage_ghcr_runtime.sh"
  workflow_dispatch:
    inputs:
      export_revision:
        description: "Export an already-built exact Git SHA as a checksummed artifact (no rebuild)"
        required: false
        default: ""
        type: string

concurrency:
  group: runtime-image-${{ github.ref }}-${{ inputs.export_revision || 'build' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/b-m-capital-research/honeclaw-runtime

jobs:
  build-and-publish:
    if: github.event_name != 'workflow_dispatch' || inputs.export_revision == ''
    name: build-and-publish (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect an existing immutable revision
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set reproducible build metadata
        if: steps.existing.outputs.published != 'true'
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build in Debian and publish immutable runtime image
        if: steps.existing.outputs.published != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          build-args: |
            HONE_BUILD_GIT_SHA=${{ github.sha }}
            HONE_BUILD_TIMESTAMP=${{ steps.metadata.outputs.timestamp }}
            HONE_BUILD_SOURCE=ghcr_linux_oci
          cache-from: type=gha,scope=hone-runtime-linux-amd64
          cache-to: type=gha,mode=max,scope=hone-runtime-linux-amd64
          provenance: mode=max
          sbom: true

      - name: Verify published manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}:${GITHUB_SHA}"
          docker buildx imagetools inspect "$image_ref" | tee /tmp/runtime-image-inspect.txt
          digest="$(awk '$1 == "Digest:" { print $2; exit }' /tmp/runtime-image-inspect.txt)"
          test "$digest" != ""
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### HONE runtime image"
            echo
            echo "- Image: \`$image_ref\`"
            echo "- Digest: \`$digest\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  export-runtime:
    name: Export verified existing runtime
    if: github.event_name == 'workflow_dispatch' && inputs.export_revision != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate exact revision
        env:
          EXPORT_REVISION: ${{ inputs.export_revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPORT_REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Log in with job-scoped read permission
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export and verify immutable bundle
        env:
          EXPORT_REVISION: ${{ inputs.export_revision }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${IMAGE_NAME}:${EXPORT_REVISION}"
          immutable_ref="$(docker image inspect "${IMAGE_NAME}:${EXPORT_REVISION}" --format '{{index .RepoDigests 0}}')"
          [[ "$immutable_ref" =~ ^ghcr.io/b-m-capital-research/honeclaw-runtime@sha256:[0-9a-f]{64}$ ]]
          container_id="$(docker create --platform linux/amd64 "$immutable_ref" /unused)"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "${container_id}:/release" ./runtime-release
          bash runtime-release/tools/verify_runtime_bundle.sh runtime-release "$EXPORT_REVISION"
          mkdir runtime-export
          printf '%s\n' "$immutable_ref" > runtime-export/IMAGE_DIGEST
          tar -C runtime-release -czf runtime-export/runtime-bundle.tar.gz .
          (cd runtime-export && sha256sum runtime-bundle.tar.gz > runtime-bundle.tar.gz.sha256)

      - name: Upload checksummed runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-bundle-${{ inputs.export_revision }}
          path: runtime-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
