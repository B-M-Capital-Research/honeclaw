services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: honeclaw
      POSTGRES_USER: honeclaw
      POSTGRES_PASSWORD: honeclaw_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - honeclaw_pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  honeclaw_pg_dev_data:
